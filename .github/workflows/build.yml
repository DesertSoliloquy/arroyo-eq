name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -O2 -std=c++17 -ISource tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  windows-vst3:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target ArroyoEQ_VST3 --parallel

      - name: Get pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PLUGINVAL_URL -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      # ---- diagnostics (report only; they do not block the build) ----
      - name: "Diagnostic: pluginval under the Windows debugger (cdb)"
        continue-on-error: true
        shell: pwsh
        run: |
          $cdb = Get-ChildItem -Recurse "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers" -Filter cdb.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $cdb) { Write-Host "cdb not found on this runner"; exit 0 }
          Write-Host "Using $($cdb.FullName)"
          $plugin = "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          $sym = "srv*C:\symcache*https://msdl.microsoft.com/download/symbols;" + (Resolve-Path build).Path
          # Break on access violations, stack overflow, heap corruption and
          # fail-fast; print the faulting stack, then quit.
          $cmds = 'sxe -c ".echo ===== EXCEPTION =====;.lastevent;.ecxr;kp 80;q" av;' +
                  'sxe -c ".echo ===== STACK OVERFLOW =====;.lastevent;kp 200;q" sov;' +
                  'sxe -c ".echo ===== HEAP CORRUPTION =====;.lastevent;kp 80;q" c0000374;' +
                  'sxe -c ".echo ===== FAIL FAST =====;.lastevent;kp 80;q" c0000409;' +
                  'g'
          & $cdb.FullName -G -lines -y $sym -c $cmds .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 $plugin
          Write-Host "debugger session exit code: $LASTEXITCODE"

      - name: "Diagnostic: control build with JUCE's generic editor"
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -B build-generic -A x64 -DARROYO_GENERIC_EDITOR=ON
          cmake --build build-generic --config Release --target ArroyoEQ_VST3 --parallel
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 "build-generic\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          Write-Host ("generic-editor pluginval exit code: {0} (0x{0:X8})" -f $LASTEXITCODE)

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pv-log | Out-Null
          .\pluginval\pluginval.exe --strictness-level 10 --verbose --timeout-ms 300000 --output-dir pv-log "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          $code = $LASTEXITCODE
          Write-Host ("pluginval exit code: {0} (0x{0:X8})" -f $code)
          if ($code -ne 0) { exit 1 }

      - name: Upload pluginval log and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            pv-log
            build/**/*.pdb

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3" dist\
          Get-ChildItem -Recurse dist -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ArroyoEQ-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArroyoEQ-Windows-VST3
          path: ArroyoEQ-Windows-VST3.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArroyoEQ-Windows-VST3.zip
