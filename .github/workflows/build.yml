name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -O2 -std=c++17 -ISource tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  windows-vst3:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target ArroyoEQ_VST3 --parallel

      - name: Get pluginval 1.0.4 and 2.0 beta 2
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pv1.zip
          Expand-Archive pv1.zip -DestinationPath pv1
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v2.0.0-beta2/pluginval_Windows.zip -OutFile pv2.zip
          Expand-Archive pv2.zip -DestinationPath pv2

      # pluginval is a Windows GUI-subsystem program: PowerShell does not wait
      # for those, so it is run from cmd, which does wait and passes on the
      # exit code.
      - name: Validate with pluginval 1.0.4 (strictness 10)
        shell: cmd
        run: pv1\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 --output-dir pv-log "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"

      - name: Validate with pluginval 2.0 beta 2 (strictness 10, includes Steinberg's validator)
        shell: cmd
        run: pv2\pluginval.exe --strictness-level 10 --timeout-ms 300000 --output-dir pv-log "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"

      - name: Upload pluginval logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pv-log

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3" dist\
          Get-ChildItem -Recurse dist -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ArroyoEQ-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArroyoEQ-Windows-VST3
          path: ArroyoEQ-Windows-VST3.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArroyoEQ-Windows-VST3.zip
