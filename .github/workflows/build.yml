name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -O2 -std=c++17 -ISource tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  windows-vst3:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target ArroyoEQ_VST3 --parallel

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3" dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ArroyoEQ-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArroyoEQ-Windows-VST3
          path: ArroyoEQ-Windows-VST3.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArroyoEQ-Windows-VST3.zip
