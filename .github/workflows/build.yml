name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -O2 -std=c++17 -ISource tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  windows-vst3:
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DARROYO_BUILD_SNAPSHOT=ON

      - name: Build VST3
        run: cmake --build build --config Release --target ArroyoEQ_VST3 --parallel

      - name: Get pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PLUGINVAL_URL -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      # ---- diagnostics (report only; they do not block the build) ----
      - name: "Diagnostic: pluginval 2.0 beta 2 (prints a backtrace on crash)"
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v2.0.0-beta2/pluginval_Windows.zip -OutFile pv2.zip
          Expand-Archive pv2.zip -DestinationPath pv2
          .\pv2\pluginval.exe --strictness-level 10 --verbose --timeout-ms 300000 "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "Diagnostic: editor stress test on Windows"
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --target ArroyoStress --parallel
          $exe = Get-ChildItem -Recurse build -Filter ArroyoStress.exe | Select-Object -First 1
          & $exe.FullName background 1000; $a = $LASTEXITCODE
          & $exe.FullName message 1000; $b = $LASTEXITCODE
          if ($a -ne 0 -or $b -ne 0) { exit 1 }

      - name: Validate with pluginval (strictness 10)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pv-log | Out-Null
          .\pluginval\pluginval.exe --strictness-level 10 --verbose --timeout-ms 300000 --output-dir pv-log "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload pluginval log and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            pv-log
            build/**/*.pdb

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "build\ArroyoEQ_artefacts\Release\VST3\Arroyo EQ.vst3" dist\
          Get-ChildItem -Recurse dist -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath ArroyoEQ-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArroyoEQ-Windows-VST3
          path: ArroyoEQ-Windows-VST3.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArroyoEQ-Windows-VST3.zip
